spring:
  application:
    name: phishshield-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: ${ML_SERVICE_TIMEOUT_MS:3000}
  ssrf:
    enabled: ${SSRF_PROTECTION_ENABLED:true}
    allow-private-ips: ${SSRF_ALLOW_PRIVATE_IPS:false}

# OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
