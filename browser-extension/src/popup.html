<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prahar Web Protection</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="shield-icon">🛡️</div>
        <div>
          <h1 class="title">Prahar</h1>
          <p class="subtitle">Web Protection</p>
        </div>
      </div>
      <div id="status-badge" class="badge badge-safe">Checking...</div>
    </header>

    <!-- Active URL Tab Status -->
    <main class="main-content">
      <div class="card current-site">
        <span class="label">CURRENT WEBSITE:</span>
        <p id="current-url" class="url-text">Loading active tab...</p>
        <div id="risk-score-display" class="risk-score-box">
          <span class="score-label">Threat Score</span>
          <span id="risk-score-val" class="score-num">--</span>
        </div>
      </div>

      <!-- Verdict Banner -->
      <div id="verdict-banner" class="verdict-card verdict-safe">
        <h3 id="verdict-title">Verifying security signals...</h3>
        <p id="verdict-explanation">Prahar is inspecting domain heuristics and threat markers.</p>
      </div>

      <!-- Quick Manual URL Check -->
      <div class="manual-check">
        <input type="text" id="manual-url-input" placeholder="Check another link..." />
        <button id="manual-check-btn" class="btn btn-primary">Check</button>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="open-dashboard-btn" class="btn btn-outline">Open Prahar Dashboard</button>
        <button id="report-site-btn" class="btn btn-danger-outline">Report This Page</button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>© 2026 Prahar • Real-Time Protection</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
