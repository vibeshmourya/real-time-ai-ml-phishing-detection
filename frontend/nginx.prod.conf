# ==============================================================================
# PRAHAR 2.0 - PRODUCTION SECURE REVERSE PROXY CONFIGURATION (NGINX)
# Features: TLS 1.2/1.3, Rate Limiting, Security Headers, Host Restriction,
#           SSE Support, Size Bounds, and Direct Private Port Isolation
# ==============================================================================

# Rate Limiting Zones (Defined in http context or main config)
limit_req_zone $binary_remote_addr zone=prahar_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=prahar_scan_limit:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 1. Catch-All Default Server Block (Drop Unknown Hostnames / Direct IP Scans)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # Fallback dummy certificates for rejecting unsolicited IP probes
    ssl_certificate /etc/nginx/ssl/dummy.crt;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;

    # Silently close connection for unrecognized host headers
    return 444;
}

# ------------------------------------------------------------------------------
# 2. HTTP to HTTPS Redirection Block
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prahar.security.example.com; # Replace with verified domain

    # ACME Challenge for Let's Encrypt HTTP-01 automated validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent Redirect all standard HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 3. Secure Production HTTPS Server Block
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prahar.security.example.com; # Strict Hostname Binding

    # SSL / TLS Termination Configuration
    ssl_certificate /etc/letsencrypt/live/prahar.security.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prahar.security.example.com/privkey.pem;

    # Enforce Modern TLS Protocols & High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Security Response Headers
    # --------------------------------------------------------------------------
    # HSTS: 1 Year (Notice: preload is intentionally omitted until domain validation is complete)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (Locked to trusted origins)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # Request and Upload Size Bounds
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Root Directory for Built React Application
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # API Reverse Proxy & Rate Limiting (Routes to Internal Spring Boot)
    # --------------------------------------------------------------------------
    location /api/ {
        # Enforce Rate Limiting
        limit_req zone=prahar_api_limit burst=20 nodelay;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Header Propagation & Tracing
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id; # Correlate downstream logs

        # Timeouts for standard API
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Dedicated Scanning Route with Stricter Rate Limiting
    location /api/scans/ {
        limit_req zone=prahar_scan_limit burst=5 nodelay;

        proxy_pass http://backend:8080/api/scans/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    # Real-Time SSE Notification Streaming Route
    location /api/notifications/stream {
        proxy_pass http://backend:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering and extend read timeout for long-lived SSE connections
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single Page Application HTML5 Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
