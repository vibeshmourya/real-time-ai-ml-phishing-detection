version: '3.8'

services:
  # 1. MySQL Relational Database Service
  mysql-db:
    image: mysql:8.0
    container_name: phishshield-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-phishshield_db}
      MYSQL_USER: ${DB_USER:-phishshield_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-phishshield_secure_password_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - phishshield-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Python FastAPI Machine Learning Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: phishshield-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./ml-service/models:/app/models:ro
    networks:
      - phishshield-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Spring Boot Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishshield-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-mysql}
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-phishshield_db}
      - DB_USER=${DB_USER:-phishshield_user}
      - DB_PASSWORD=${DB_PASSWORD:-phishshield_secure_password_2026}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_TIMEOUT_MS=${ML_SERVICE_TIMEOUT_MS:-3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080,chrome-extension://*}
      - SSRF_PROTECTION_ENABLED=${SSRF_PROTECTION_ENABLED:-true}
      - SSRF_ALLOW_PRIVATE_IPS=${SSRF_ALLOW_PRIVATE_IPS:-false}
      - AI_PROVIDER=${AI_PROVIDER:-none}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-15000}
    depends_on:
      mysql-db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - phishshield-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 4. React Frontend Web Application (Reverse Proxy Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishshield-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - phishshield-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
    driver: local

networks:
  phishshield-network:
    driver: bridge
